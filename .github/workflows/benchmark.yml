name: bench
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4            # the branch under test
        with:
          path: branch
      - uses: actions/checkout@v4            # upstream main for the "main ctrace" variant
        with:
          repository: tarpas/pytest-testmon
          ref: main
          path: main-wt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Venv with the branch
        run: |
          python -m venv venv
          venv/bin/pip install -e ./branch pytest-cov pytest-xdist

      - name: Benchmark projects (cached)
        uses: actions/cache@v4
        id: projects
        with:
          path: work
          key: bench-projects-miter-10.5.0-nx-3.4.2
      - if: steps.projects.outputs.cache-hit != 'true'
        run: |
          mkdir -p work
          git clone --depth 1 --branch v10.5.0 https://github.com/more-itertools/more-itertools work/more-itertools
          # the projects' own test deps
          true

      - name: Run bench
        run: |
          venv/bin/pip install -q -r work/more-itertools/requirements/test.txt 2>/dev/null || true
          SCEN="${{ inputs.scenarios }}"
          # scenario names contain spaces, so pass them one per line
          mapfile -t ARGS < <(printf '%s\n' "$SCEN" | tr ',' '\n' | sed '/^$/d')
          venv/bin/python branch/bench/bench.py "$PWD/venv/bin/python" "$PWD/main-wt" "$PWD/work" "${{ inputs.reps || 5 }}" "${ARGS[@]}" \
            | tee bench.txt
          { echo "### Python ${{ matrix.python }}"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-py${{ matrix.python }}
          path: bench.txt
