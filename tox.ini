[tox]
envlist =
    py311
    xdist-py311
    xdist-cov6-py311
    xdist-cov7-py311
    xdist-cov6-covmain-py311
    pytest8-py311
    pytest9-py314
    pytest9-py315


[pytest]
norecursedirs = .*
                dist
                experiments
# leaked sqlite connections and files fail the suite (they are reported at garbage collection,
# as unraisable exceptions)
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning

[testenv]
passenv = PYTHONPATH
setenv = TESTMON_DATAFILE=.testmondata.tox
allowlist_externals = git
commands = pytest -c tox.ini --tb=native -v -s {posargs:tests}
deps =
    xdist: pytest-xdist
    pytest8: pytest==8.3.5
    pytest9: pytest==9.0.1
    cov6: pytest-cov<7
    cov7: pytest-cov>=7,<8
    covmain: git+https://github.com/coveragepy/coveragepy@main#egg=coverage
    pytest-mock
    coverage<8


[gh-actions]
python =
    3.11: pytest8-py311, xdist-py311, xdist-cov6-py311, xdist-cov7-py311, xdist-cov6-covmain-py311
    3.14: pytest9-py314
    3.15: pytest9-py315
