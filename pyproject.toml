[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-testmon"
authors = [
    { name = "Tibor Arpas", email = "tibor@testmon.org" },
]
dynamic = ["version"]

description = "selects tests affected by changed files and methods"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["testing", "pytest", "plugin"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Programming Language :: Python",
    "Framework :: Pytest",
]
dependencies = [
    "pytest<10,>=5",
    "coverage>=6,<8",
]

[project.urls]
Homepage = "https://testmon.org"
Source = "https://github.com/tarpas/pytest-testmon"

[project.entry-points.pytest11]
pytest-testmon = "testmon.pytest_testmon"

[tool.setuptools]
packages = ["testmon"]

[tool.setuptools.dynamic]
version = {attr = "testmon.TESTMON_VERSION"}

# Development dependencies, managed by uv: `uv sync` then `uv run pytest` / `uv run tox`.
[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov",
    "pytest-xdist",
    "pytest-mock",
    "ruff",
    "tox",
    "tox-gh-actions",
    "pre-commit",
]
